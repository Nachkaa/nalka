name: NKA-001 Next.js security patch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/nka-001-next-security-patch.yml

permissions:
  contents: write

jobs:
  patch-next:
    runs-on: ubuntu-latest
    env:
      AUTH_SECRET: ci-nalka-nka-001-secret
      NEXTAUTH_SECRET: ci-nalka-nka-001-secret
      NEXTAUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      MAIL_MODE: console
      MAIL_FROM: ci@nalka.invalid
      DATABASE_URL: postgresql://ci:ci@localhost:5432/nalka_ci
      SHADOW_DATABASE_URL: postgresql://ci:ci@localhost:5432/nalka_ci_shadow
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install baseline dependencies
        run: pnpm install --frozen-lockfile

      - name: Upgrade Next.js maintenance-LTS patch
        run: pnpm up next@15.5.24 eslint-config-next@15.5.24 --save-exact

      - name: Verify lockfile is reproducible
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Commit validated dependency update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "No dependency changes to commit."
            exit 0
          fi
          git commit -m "chore(security): upgrade Next.js to 15.5.24"
          git push origin HEAD:main
