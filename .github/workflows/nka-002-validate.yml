name: NKA-002 validate

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/nka-002-validate.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://nalka:nalka@127.0.0.1:5432/nalka_ci
      AUTH_SECRET: ci-nalka-auth-route-secret
      NEXTAUTH_SECRET: ci-nalka-auth-route-secret
      NEXTAUTH_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      MAIL_MODE: console
      MAIL_FROM: ci@nalka.invalid

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Next types
        run: pnpm exec next typegen

      - name: Auth route regression tests
        run: pnpm test:auth-routes

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Runtime direct event redirect smoke
        run: |
          pnpm start > /tmp/nalka-nka002.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --silent --output /dev/null http://127.0.0.1:3000/login; then
              break
            fi
            sleep 1
          done

          curl --silent --show-error --dump-header /tmp/nka002-headers.txt --output /dev/null \
            http://127.0.0.1:3000/event

          status=$(awk 'NR==1 {print $2}' /tmp/nka002-headers.txt)
          if [ "$status" != "307" ] && [ "$status" != "308" ]; then
            cat /tmp/nka002-headers.txt
            cat /tmp/nalka-nka002.log
            exit 1
          fi

          tr -d '\r' < /tmp/nka002-headers.txt | grep -Fqi 'location: /login?from=%2Fevent'
